# XcodeGen spec. Generates DavidLedger.xcodeproj from these sources:
#   brew install xcodegen && xcodegen generate
#
# The project file itself is intentionally not committed — it is derived from this spec, and a
# generated .xcodeproj is a constant source of merge conflicts.
name: DavidLedger
options:
  bundleIdPrefix: com.davidjeong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # Set your Apple Developer team ID here, or select it in Xcode.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  LedgerParser:
    path: .

targets:
  DavidLedger:
    type: application
    platform: iOS
    sources:
      - DavidLedger
    dependencies:
      - package: LedgerParser
        product: LedgerParser
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidjeong.ledger
        INFOPLIST_FILE: DavidLedger/Info.plist
        CODE_SIGN_ENTITLEMENTS: DavidLedger/DavidLedger.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # The extension writes to the same store as the app, so it needs the same model and
      # store code compiled into it.
      - path: DavidLedger/Model
      - path: DavidLedger/Support
    dependencies:
      - package: LedgerParser
        product: LedgerParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidjeong.ledger.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  DavidLedger:
    build:
      targets:
        DavidLedger: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LedgerParserTests
