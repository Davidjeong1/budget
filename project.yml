# XcodeGen spec. Generates DavidLedger.xcodeproj from these sources:
#   brew install xcodegen && xcodegen generate
#
# The project file itself is intentionally not committed — it is derived from this spec, and a
# generated .xcodeproj is a constant source of merge conflicts.
name: DavidLedger
options:
  bundleIdPrefix: com.davidjeong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # DEVELOPMENT_TEAM is deliberately unset — select your team in Xcode's Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  LedgerCore:
    path: .

targets:
  DavidLedger:
    type: application
    platform: iOS
    sources:
      - DavidLedger
    dependencies:
      - package: LedgerCore
        product: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidjeong.ledger
        INFOPLIST_FILE: DavidLedger/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  DavidLedger:
    build:
      targets:
        DavidLedger: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # A SwiftPM test target, not a project target — the bare name form would fail validation.
        - package: LedgerCore/LedgerCoreTests
